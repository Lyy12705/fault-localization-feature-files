[project]
name = "bug-tracking-llm-system"
version = "0.1.0"
description = "Integrated bug tracking and repair pipeline following bug_tracking_llm_system_code_flow_plan.md."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ml = [
  "joblib>=1.3",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14",
  "scikit-learn>=1.3",
  "requests>=2.31",
]
fault-localization = [
  "sentence-transformers>=2.7",
]
datasets = [
  "pandas>=2.0",
  "pyarrow>=14",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Without this, a bare `pytest`/`python -m pytest` walks the WHOLE repo root
# (including any non-test scratch/output folders someone has dropped inside
# the connected project folder, e.g. a "Claude outputs" drop folder) and can
# collect a same-named stray copy of a real tests/*.py file -- pytest then
# refuses with "import file mismatch" because it can't tell the two apart.
# Scoping collection to tests/ avoids that class of collision entirely.
testpaths = ["tests"]
